<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffe3ec">
<meta property="og:title" content="رسالة خاصة للمهندسة سارة">
<meta property="og:description" content="لو حضرتك المهندسة سارة، برجاء الضغط هنا">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>شكراً م. سارة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* Layout: one full-screen "drawing sheet" on pink drafting paper; scenes flip in and out of it like turned sheets, petals fall over everything. */
:root{
  --blush:#ffe3ec;
  --paper:#fff8fb;
  --rose:#f6a5c2;
  --pink:#d93a78;
  --ink:#5b1636;
  --grid:rgba(217,58,120,.10);
  --grid-strong:rgba(217,58,120,.18);
  --f-display:"Reem Kufi","Segoe UI","Tahoma",sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI","Tahoma",sans-serif;
  --f-script:"Aref Ruqaa","Amiri","Times New Roman",serif;
  --f-num:"Cairo","Segoe UI","Tahoma",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{
  background:
    radial-gradient(ellipse at 50% 35%, rgba(255,255,255,.75), transparent 60%),
    linear-gradient(var(--grid-strong) 1px, transparent 1px) 0 0/100px 100px,
    linear-gradient(90deg, var(--grid-strong) 1px, transparent 1px) 0 0/100px 100px,
    linear-gradient(var(--grid) 1px, transparent 1px) 0 0/20px 20px,
    linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/20px 20px,
    var(--blush);
  color:var(--ink);
  font-family:var(--f-body);
  overflow:hidden;
}
#app{position:relative;height:100%;}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.frame{
  position:fixed;z-index:1;pointer-events:none;
  top:calc(10px + env(safe-area-inset-top,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));
  left:calc(10px + env(safe-area-inset-left,0px));right:calc(10px + env(safe-area-inset-right,0px));
  border:1.5px solid rgba(217,58,120,.35);
  outline:1px solid rgba(217,58,120,.18);outline-offset:4px;
}
.frame span{
  position:absolute;bottom:8px;left:12px;font-family:var(--f-body);font-size:11px;
  color:rgba(91,22,54,.55);font-variant-numeric:tabular-nums;
}
#stage{position:relative;z-index:2;height:100%;}
.scene{
  position:absolute;inset:0;overflow-y:auto;
  display:flex;flex-direction:column;
  padding-left:max(24px, env(safe-area-inset-left,0px));
  padding-right:max(24px, env(safe-area-inset-right,0px));
  padding-block:40px;
  opacity:0;transform:perspective(1000px) rotateX(-75deg) translateY(30px);
  transform-origin:50% 0%;
  transition:transform .75s cubic-bezier(.2,.85,.25,1), opacity .5s ease;
}
.scene.on{opacity:1;transform:none}
.scene.off{opacity:0;transform:perspective(1000px) rotateX(70deg) translateY(-30px);transform-origin:50% 100%;pointer-events:none}
.inner{margin-block:auto;margin-inline:auto;width:100%;max-width:680px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}

.eyebrow{font-size:14px;color:rgba(91,22,54,.7);font-weight:500}
.big{font-family:var(--f-display);font-weight:700;font-size:clamp(2rem,8.5vw,4.4rem);line-height:1.35;text-wrap:balance;margin:0}
.big em{font-style:normal;color:var(--pink)}
.mid{font-family:var(--f-display);font-weight:500;font-size:clamp(1.3rem,5vw,2.2rem);line-height:1.5;text-wrap:balance;margin:0}
.script{font-family:var(--f-script);font-weight:700;color:var(--pink);line-height:1.2}

/* intro */
.go{
  font-family:var(--f-display);font-weight:700;font-size:clamp(1.15rem,4.5vw,1.5rem);
  color:#fff;background:var(--pink);border:0;border-radius:999px;
  padding:16px 38px;cursor:pointer;position:relative;
  box-shadow:0 10px 30px rgba(217,58,120,.35);
  transition:transform .2s ease, box-shadow .2s ease;
}
.go::after{content:"";position:absolute;inset:-6px;border-radius:999px;border:2px solid var(--pink);opacity:.5;animation:ring 1.8s ease-out infinite}
.go:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(217,58,120,.45)}
.go:focus-visible{outline:3px solid var(--ink);outline-offset:6px}
@keyframes ring{from{transform:scale(1);opacity:.55}to{transform:scale(1.25);opacity:0}}
.hint{font-size:13px;color:rgba(91,22,54,.6)}

/* stamps */
.stamps{display:flex;flex-direction:column;align-items:center;gap:16px}
.stamp{
  font-family:var(--f-display);font-weight:700;font-size:clamp(1.4rem,6vw,2.4rem);
  color:var(--pink);border:3px solid var(--pink);border-radius:10px;padding:6px 22px;
  background:rgba(255,248,251,.7);
  animation:stamp .55s cubic-bezier(.3,1.6,.5,1) both;
}
.stamp:nth-child(1){--r:-4deg;animation-delay:.2s}
.stamp:nth-child(2){--r:3deg;animation-delay:1.3s}
.stamp:nth-child(3){--r:-2deg;animation-delay:2.4s}
@keyframes stamp{from{opacity:0;transform:scale(2.4) rotate(var(--r))}to{opacity:1;transform:scale(1) rotate(var(--r))}}

/* counter */
.thanks{font-size:clamp(3.2rem,15vw,7rem);margin:0}
.flip{display:flex;gap:clamp(8px,2.5vw,14px);perspective:600px}
.tile{
  position:relative;width:clamp(68px,22vw,112px);aspect-ratio:3/4;max-width:100%;
  display:grid;place-items:center;border-radius:14px;
  background:linear-gradient(180deg,#ffffff 0 50%,#fff1f6 50% 100%);
  border:1.5px solid rgba(217,58,120,.28);
  box-shadow:0 2px 0 rgba(217,58,120,.18),0 14px 30px rgba(217,58,120,.22);
  font-family:var(--f-num);font-weight:900;font-size:clamp(3.4rem,15vw,6.2rem);line-height:1;
  color:var(--pink);transform-style:preserve-3d;overflow:hidden;
}
.tile::after{content:"";position:absolute;inset:50% 0 auto;height:1.5px;background:rgba(217,58,120,.22)}
.tile::before,.tile i{content:"";position:absolute;top:calc(50% - 5px);width:6px;height:10px;border-radius:3px;background:rgba(217,58,120,.3)}
.tile::before{right:-3px}.tile i{left:-3px}
.tile span{position:relative;top:-.06em}
.tile.lead span{color:rgba(217,58,120,.2)}
.dwg{font-family:var(--f-num);font-weight:700;font-size:13px;color:rgba(91,22,54,.6)}
.label{font-family:var(--f-display);font-size:clamp(1.1rem,4.4vw,1.6rem);font-weight:500}
.scale{width:min(440px,100%);display:flex;flex-direction:column;gap:6px}
.bar{height:12px;border:1.5px solid var(--ink);position:relative;overflow:hidden;
  background:repeating-linear-gradient(90deg, transparent 0 calc(10% - 1.5px), rgba(91,22,54,.35) calc(10% - 1.5px) 10%)}
.fill{position:absolute;inset:0 0 0 auto;width:0;background:var(--pink)}
.ticks{display:flex;justify-content:space-between;font-family:var(--f-num);font-weight:700;font-size:12px;color:rgba(91,22,54,.65);font-variant-numeric:tabular-nums}
.done{font-family:var(--f-num);font-weight:700;color:var(--pink);border:2.5px solid var(--pink);border-radius:8px;padding:4px 16px;--r:-5deg;animation:stamp .5s cubic-bezier(.3,1.6,.5,1) both}

/* final */
.card{
  width:100%;background:var(--paper);border:1.5px solid var(--ink);
  box-shadow:0 0 0 6px var(--paper),0 0 0 7.5px rgba(91,22,54,.35),0 24px 60px rgba(217,58,120,.25);
  padding:28px 22px 0;display:flex;flex-direction:column;gap:14px;text-align:center;
}
.card .from{font-size:14px;color:rgba(91,22,54,.7);margin:0}
.card .co{font-family:var(--f-display);font-weight:700;font-size:clamp(1.3rem,5vw,1.8rem);margin:0;color:var(--pink)}
.card p{margin:0;font-size:clamp(1.05rem,4vw,1.25rem);line-height:1.8}
.card .heart-line{font-family:var(--f-script);font-weight:700;font-size:clamp(2rem,9vw,3rem);color:var(--pink);line-height:1.3}
.ln{opacity:0;animation:up .8s ease both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.tb{margin-inline:-22px;margin-top:8px;display:grid;grid-template-columns:repeat(3,1fr);border-top:1.5px solid var(--ink);font-size:12px;text-align:right}
.tb div{padding:8px 10px;border-inline-start:1px solid rgba(91,22,54,.4);border-bottom:1px solid rgba(91,22,54,.4);min-width:0}
.tb div:nth-child(3n+1){border-inline-start:0}
.tb div:nth-last-child(-n+3){border-bottom:0}
.tb b{display:block;font-weight:700;font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
.tb small{color:rgba(91,22,54,.6);font-size:11px}
.again{font-family:var(--f-display);font-size:15px;color:var(--pink);background:transparent;border:1.5px solid var(--pink);border-radius:999px;padding:8px 22px;cursor:pointer}
.again:focus-visible{outline:2px solid var(--ink);outline-offset:4px}

@media (max-width:420px){.tb{grid-template-columns:repeat(2,1fr)}.tb div:nth-child(3n+1){border-inline-start:1px solid rgba(91,22,54,.4)}.tb div:nth-child(2n+1){border-inline-start:0}.tb div:nth-last-child(-n+3){border-bottom:1px solid rgba(91,22,54,.4)}.tb div:nth-last-child(-n+2){border-bottom:0}}
@media (prefers-reduced-motion:reduce){
  .scene{transition:opacity .4s ease;transform:none}
  .scene.off{transform:none}
  .go::after{animation:none}
}
</style>
</head>
<body>

<div id="app" dir="rtl" lang="ar">
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="frame" aria-hidden="true"><span>لوحة شكر · ورقة ١ من ١</span></div>
  <main id="stage" aria-live="polite">
    <section class="scene on" id="intro">
      <div class="inner">
        <div class="eyebrow">رسالة خاصة جداً</div>
        <h1 class="big">لو حضرتك<br><em>المهندسة سارة</em></h1>
        <p class="mid">برجاء الضغط هنا</p>
        <button class="go" id="go" type="button">أنا المهندسة سارة</button>
        <div class="hint">اضغطي مرة واحدة بس، والباقي هيشتغل لوحده</div>
      </div>
    </section>
  </main>
</div>

<script>
(function(){
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const stage = document.getElementById('stage');
  const ar = n => n.toLocaleString('ar-EG');
  let token = 0;
  const sleep = (ms, t) => new Promise((res, rej) => setTimeout(() => t === token ? res() : rej('stop'), ms));

  function show(html){
    const old = stage.querySelector('.scene.on');
    if(old){ old.classList.remove('on'); old.classList.add('off'); setTimeout(() => old.remove(), 800); }
    const el = document.createElement('section');
    el.className = 'scene';
    el.innerHTML = '<div class="inner">' + html + '</div>';
    stage.appendChild(el);
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('on')));
    return el;
  }

  /* ---------- falling, flipping petals ---------- */
  const cv = document.getElementById('fx'), ctx = cv.getContext('2d');
  let W = 0, H = 0, dpr = 1;
  function size(){ dpr = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
  size(); addEventListener('resize', size);
  const colors = ['#f6a5c2','#ee7aa6','#d93a78','#ffd0e0','#ffffff'];
  const parts = [];
  let rate = reduce ? 0.15 : 0.5;
  function spawn(kind, x, y, burst){
    const s = kind === 'word' ? 16 + Math.random()*10 : 7 + Math.random()*9;
    parts.push({
      kind, x: x ?? Math.random()*W, y: y ?? -30,
      vx: burst ? (Math.random()-.5)*7 : (Math.random()-.5)*.6,
      vy: burst ? -Math.random()*7 - 2 : .7 + Math.random()*1.3,
      rot: Math.random()*6.28, vr: (Math.random()-.5)*.05,
      flip: Math.random()*6.28, vf: .03 + Math.random()*.06,
      s, c: colors[(Math.random()*colors.length)|0], sway: Math.random()*6.28
    });
  }
  function heart(s){
    ctx.beginPath(); ctx.moveTo(0, s*.35);
    ctx.bezierCurveTo(-s*1.1, -s*.35, -s*.45, -s*1.05, 0, -s*.45);
    ctx.bezierCurveTo(s*.45, -s*1.05, s*1.1, -s*.35, 0, s*.35);
    ctx.fill();
  }
  function frame(){
    ctx.clearRect(0,0,W,H);
    if(Math.random() < rate){
      const r = Math.random();
      spawn(r < .55 ? 'petal' : r < .85 ? 'heart' : r < .95 ? 'word' : 'square');
    }
    for(let i = parts.length-1; i >= 0; i--){
      const p = parts[i];
      p.sway += .02; p.x += p.vx + Math.sin(p.sway)*.4; p.y += p.vy;
      if(p.vy < 1.6) p.vy += .06; p.vx *= .985;
      p.rot += p.vr; p.flip += p.vf;
      if(p.y > H + 40){ parts.splice(i,1); continue; }
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(Math.cos(p.flip), 1);
      ctx.fillStyle = p.c; ctx.strokeStyle = '#d93a78'; ctx.globalAlpha = .9;
      if(p.kind === 'petal'){ ctx.beginPath(); ctx.ellipse(0,0,p.s*.55,p.s,0,0,6.283); ctx.fill(); }
      else if(p.kind === 'heart'){ heart(p.s); }
      else if(p.kind === 'square'){ ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(-p.s,p.s); ctx.lineTo(p.s,p.s); ctx.lineTo(-p.s,-p.s); ctx.closePath(); ctx.stroke(); }
      else { ctx.fillStyle = '#d93a78'; ctx.font = '700 ' + p.s + 'px "Aref Ruqaa", serif'; ctx.textAlign = 'center'; ctx.fillText('شكراً', 0, 0); }
      ctx.restore();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  function burst(n){ for(let i=0;i<n;i++) spawn(Math.random()<.5?'heart':'petal', W/2 + (Math.random()-.5)*80, H*.45, true); }

  /* ---------- counter ---------- */
  function count(el, from, to, dur, ease, t){
    const fill = el.querySelector('.fill');
    const start = performance.now(); let last = -1;
    return new Promise((res, rej) => {
      function step(now){
        if(t !== token) return rej('stop');
        const p = Math.min(1, (now - start)/dur);
        const n = Math.round(from + (to - from)*ease(p));
        if(n !== last){
          last = n; setTiles(el, n);
          fill.style.width = (n/500*100) + '%';
          if(Math.random() < (n < 30 ? 1 : .35)) spawn('word', Math.random()*W, -20);
        }
        p < 1 ? requestAnimationFrame(step) : res();
      }
      requestAnimationFrame(step);
    });
  }
  const digits = n => String(n).padStart(3,'0').split('').map(d => (+d).toLocaleString('ar-EG'));
  function setTiles(el, n){
    const ds = digits(n), lead = String(n).length;
    el.querySelectorAll('.tile').forEach((t, i) => {
      const sp = t.querySelector('span');
      t.classList.toggle('lead', i < 3 - lead);
      if(sp.textContent !== ds[i]){
        sp.textContent = ds[i];
        if(!reduce) t.animate([{transform:'rotateX(-90deg)'},{transform:'rotateX(12deg)',offset:.75},{transform:'none'}],{duration:220,easing:'ease-out'});
      }
    });
  }
  const tilesHTML = n => digits(n).map((d,i) => `<div class="tile${i < 3 - String(n).length ? ' lead' : ''}"><i></i><span>${d}</span></div>`).join('');
  const counterHTML = (from, label) => `
    <h2 class="thanks script">شكراً</h2>
    <div class="flip" dir="ltr" aria-hidden="true">${tilesHTML(from)}</div>
    <div class="label">${label}</div>
    <div class="scale" aria-hidden="true">
      <div class="bar"><div class="fill" style="width:${from/500*100}%"></div></div>
      <div class="ticks"><span>٠</span><span>١٥٠</span><span>٢٥٠</span><span>٥٠٠</span></div>
    </div>
    <div class="slot" style="min-height:44px"></div>`;

  /* ---------- the show ---------- */
  async function run(){
    const t = ++token;
    const k = reduce ? .7 : 1;
    try{
      rate = reduce ? .2 : 1.1;
      show('<div class="eyebrow">استني بس…</div><h2 class="big">لأ… مش <em>المهندسة سارة</em> وبس</h2>');
      await sleep(2700*k, t);
      show('<div class="stamps"><div class="stamp">أعظم مهندسة عندنا في الشركة</div><div class="stamp">أشطر مهندسة</div><div class="stamp">أحسن حد عندنا</div></div>');
      await sleep(4300*k, t);
      show('<h2 class="mid">المهندسة اللي تعبناها معانا كتير…</h2><h2 class="big">ودايماً <em>بتساعدنا</em></h2>');
      await sleep(3200*k, t);
      show('<div class="eyebrow">عشان كده بنشكرها</div><h2 class="big">من <em>أول رسمة</em>…</h2>');
      await sleep(2300*k, t);

      let el = show(counterHTML(1, 'رسمة خاصة بالعقود'));
      await sleep(700, t);
      await count(el, 1, 150, reduce ? 3000 : 10000, p => p*p, t);
      el.querySelector('.slot').innerHTML = '<div class="done">وأكتر من ١٥٠ رسمة عقود</div>';
      burst(30);
      await sleep(2200*k, t);

      show('<h2 class="mid">ده غير طبعاً</h2><h2 class="big">كل <em>الرسومات التانية</em>…</h2>');
      await sleep(2600*k, t);

      el = show(counterHTML(150, 'رسمة عملتيها لنا'));
      await sleep(700, t);
      await count(el, 150, 500, reduce ? 2500 : 7000, p => p<.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2, t);
      el.querySelector('.slot').innerHTML = '<div class="done">وأكتر من ٥٠٠ رسمة</div>';
      burst(45);
      await sleep(2400*k, t);

      show('<h2 class="mid">ورغم كل الشكر ده…</h2>');
      await sleep(2300*k, t);
      show('<h2 class="big">ما يوفيش <em>حقك</em></h2>');
      await sleep(2400*k, t);
      show('<h2 class="script" style="font-size:clamp(3.4rem,16vw,7.5rem);margin:0">شكراً لحضرتك</h2>');
      burst(70);
      await sleep(3200*k, t);

      rate = reduce ? .15 : .7;
      show(`
        <article class="card">
          <p class="from ln" style="animation-delay:.3s">رسالة شكر من</p>
          <p class="co ln" style="animation-delay:.6s">المعمرون العرب</p>
          <p class="ln" style="animation-delay:1.6s">والشكر ده مخصوص من <strong>يوسف</strong>،<br>لأنه كان بينسى يشكر حضرتك كتير</p>
          <p class="heart-line ln" style="animation-delay:3s">شكراً جداً من القلب</p>
          <p class="ln" style="animation-delay:4.4s">ومعلش… إحنا آسفين إننا بنتعب حضرتك</p>
          <div class="tb ln" style="animation-delay:5.4s">
            <div><small>المشروع</small><b>شكر وتقدير</b></div>
            <div><small>التصميم</small><b>م. سارة</b></div>
            <div><small>عدد اللوحات</small><b>+٥٠٠</b></div>
            <div><small>المقياس</small><b>١ : ∞</b></div>
            <div><small>من</small><b>يوسف</b></div>
            <div><small>الحالة</small><b>معتمد ✓</b></div>
          </div>
        </article>
        <button class="again ln" style="animation-delay:6.2s" type="button" id="again">شوفيها تاني</button>`);
      await sleep(400, t);
      burst(40);
      document.getElementById('again').addEventListener('click', run);
    }catch(e){ /* restarted */ }
  }
  document.getElementById('go').addEventListener('click', run);
})();
</script>
</body>
</html>
