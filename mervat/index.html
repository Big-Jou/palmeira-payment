<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>شكرًا أستاذة مرفت</title>
<meta property="og:title" content="شكرًا أستاذة مرفت">
<meta property="og:description" content="كلمة شكر بسيطة">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f1ea;--card:#fff;--ink:#22303c;--muted:#7a8590;--accent:#1f6b4f;--line:#e6e2d6}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.card{width:min(440px,100%);background:var(--card);border-radius:18px;padding:36px 26px 30px;text-align:center;
  box-shadow:0 18px 40px rgba(34,48,60,.10);border-top:5px solid var(--accent);animation:up .8s ease-out}
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.icon{width:56px;height:56px;border-radius:50%;background:#e7f2ec;color:var(--accent);display:grid;place-items:center;margin:0 auto 16px;font-size:26px}
small{color:var(--muted);font-size:14px}
h1{font-size:30px;font-weight:700;margin:4px 0 20px;color:var(--accent)}
p{font-size:17px;line-height:2}
.list{list-style:none;margin:22px 0;border-top:1px solid var(--line)}
.list li{padding:12px 4px;border-bottom:1px solid var(--line);font-size:16px;display:flex;align-items:center;gap:10px;text-align:right}
.list li:before{content:"✔";color:var(--accent);font-weight:700}
.from{margin-top:22px;color:var(--muted);font-size:14px}
.sig{font-family:'Aref Ruqaa';font-size:32px;color:var(--ink);line-height:1.4}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
</style>
</head>
<body>
  <main class="card">
    <div class="icon">✉</div>
    <small>إلى الأستاذة</small>
    <h1>مرفت</h1>
    <p>حبيت أقولك كلمة شكر بسيطة</p>
    <ul class="list">
      <li>على حبك للشركة</li>
      <li>وعلى إنك من أساسها ومن أول يوم</li>
      <li>وعلى إنك دايمًا بتساعدينا كلنا</li>
    </ul>
    <p>شكرًا ليكي، وربنا يوفقك.</p>
    <div class="from">مع التحية،</div>
    <div class="sig">يوسف</div>
  </main>
</body>
</html>
