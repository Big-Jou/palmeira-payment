<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>شكرًا أستاذة مرفت 🌷</title>
<meta property="og:title" content="رسالة شكر للأستاذة مرفت 🌷">
<meta property="og:description" content="من الشركة وكل الفريق">
<meta name="theme-color" content="#0e3b2c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Aref+Ruqaa:wght@700&family=Reem+Kufi:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#e9c46a;--gold2:#b8923c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0e3b2c}
body{font-family:'Cairo',sans-serif;color:#fff;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}

/* backgrounds */
.bg{position:fixed;inset:-10%;opacity:0;transition:opacity 1.4s ease;animation:drift 18s ease-in-out infinite alternate}
.bg.show{opacity:1}
@keyframes drift{to{transform:translate(3%,-2%) scale(1.06)}}
#bokeh{position:fixed;inset:0;z-index:1;pointer-events:none}
.vignette{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.45))}

/* chrome */
.bars{position:fixed;top:0;left:0;right:0;display:flex;gap:4px;padding:calc(10px + env(safe-area-inset-top)) 12px 0;z-index:30;direction:ltr}
.bar{flex:1;height:3px;background:rgba(255,255,255,.25);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#fff}
.mute{position:fixed;top:calc(22px + env(safe-area-inset-top));left:12px;z-index:30;background:rgba(255,255,255,.15);color:#fff;border:0;width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer;backdrop-filter:blur(6px)}
.tap{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:12px;opacity:.5;z-index:30}

/* scenes */
.stage{position:fixed;inset:0;z-index:10}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;visibility:hidden}
.scene.on{visibility:visible}
.scene.out{visibility:visible;animation:sceneOut .5s ease forwards}
@keyframes sceneOut{to{opacity:0;transform:scale(1.04);filter:blur(8px)}}

.w{display:inline-block;opacity:0}
.on .w{animation:wIn 1s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:var(--d,0s)}
@keyframes wIn{from{opacity:0;transform:translateY(26px) scale(.95);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}

.sm{font-size:clamp(17px,4.8vw,22px);opacity:.85;letter-spacing:.5px}
.md{font-size:clamp(30px,8.5vw,46px);font-weight:700;line-height:1.5;text-shadow:0 4px 20px rgba(0,0,0,.25)}
.name{font-family:'Aref Ruqaa';font-size:clamp(96px,30vw,170px);line-height:1.1;padding:0 10px}
.gold{background:linear-gradient(100deg,#b8923c 0%,#f6e3a4 25%,#e9c46a 45%,#fff4cf 55%,#c9a24a 75%,#b8923c 100%);background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 3.5s linear infinite}
.on .gold.w{animation:wIn 1.1s cubic-bezier(.2,.8,.2,1) forwards,shine 3.5s linear infinite;animation-delay:var(--d,0s),0s}
@keyframes shine{to{background-position:-250% 0}}

/* svg drawing */
.draw{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
.on .draw{animation:draw var(--t,1.6s) ease-in-out forwards;animation-delay:var(--d,0s)}
@keyframes draw{to{stroke-dashoffset:0}}
.fillin{opacity:0}
.on .fillin{animation:fillin 1s ease forwards;animation-delay:var(--d,0s)}
@keyframes fillin{to{opacity:1}}
.pop{transform-box:fill-box;transform-origin:center;transform:scale(0)}
.on .pop{animation:pop .8s cubic-bezier(.3,1.6,.5,1) forwards;animation-delay:var(--d,0s)}
@keyframes pop{to{transform:scale(1)}}
.icon{width:min(42vw,170px);height:auto;margin-bottom:18px;overflow:visible;filter:drop-shadow(0 6px 18px rgba(0,0,0,.25))}
.underline{width:min(70vw,300px);height:30px;margin-top:-6px}

/* rays */
.rays{position:absolute;width:160vmax;height:160vmax;left:50%;top:50%;margin:-80vmax 0 0 -80vmax;opacity:0;
  background:repeating-conic-gradient(from 0deg,rgba(255,240,200,.16) 0deg 6deg,transparent 6deg 18deg);
  -webkit-mask:radial-gradient(circle,#000 0,transparent 55%);mask:radial-gradient(circle,#000 0,transparent 55%)}
.on .rays{animation:raysIn 1.5s ease forwards,spin 40s linear infinite}
@keyframes raysIn{to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}

/* certificate */
.cert{position:relative;width:min(88vw,380px);aspect-ratio:3/4;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px}
.cert svg.frame{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.cert .title{font-family:'Reem Kufi';font-size:clamp(28px,8vw,38px);line-height:1.4;margin-top:10px}
.cert .to{font-size:15px;opacity:.8;margin-top:18px}
.cert .nm{font-family:'Aref Ruqaa';font-size:clamp(52px,15vw,70px);line-height:1.2}
.cert .from{font-size:15px;margin-top:16px;opacity:.9;border-top:1px solid rgba(233,196,106,.5);padding-top:12px}

.btn{margin-top:28px;background:rgba(255,255,255,.95);color:#0e3b2c;border:0;font-family:inherit;font-weight:700;font-size:16px;padding:12px 28px;border-radius:999px;cursor:pointer;box-shadow:0 10px 24px rgba(0,0,0,.2)}
.bouquet{width:min(70vw,280px);height:auto;overflow:visible;margin-bottom:6px}

/* start */
.start{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;
  background:radial-gradient(circle at 50% 40%,#1b6a4f,#0b2e22 70%);transition:opacity .8s,visibility .8s}
.start.gone{opacity:0;visibility:hidden}
.start .env{font-size:64px;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px) rotate(-3deg)}}
.start h2{font-family:'Reem Kufi';font-size:26px;color:var(--gold)}
.play{width:84px;height:84px;border-radius:50%;background:#fff;color:#0e3b2c;border:0;font-size:30px;cursor:pointer;padding-right:5px;animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(233,196,106,.6)}70%{box-shadow:0 0 0 24px rgba(233,196,106,0)}100%{box-shadow:0 0 0 0 rgba(233,196,106,0)}}
.start small{opacity:.6;font-size:13px}

.petal{position:fixed;top:-40px;pointer-events:none;z-index:20;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--x,0),115vh) rotate(420deg)}}
@media (prefers-reduced-motion:reduce){.bg{animation:none}}
</style>
</head>
<body>

<div id="bgs"></div>
<canvas id="bokeh"></canvas>
<div class="vignette"></div>

<div class="start" id="start">
  <div class="env">💌</div>
  <h2>رسالة للأستاذة مرفت</h2>
  <button class="play" id="play" aria-label="تشغيل">▶</button>
  <small>شغّلي الصوت 🔊</small>
</div>

<div class="bars" id="bars"></div>
<button class="mute" id="mute" aria-label="الصوت">🔊</button>

<div class="stage" id="stage">

  <!-- 1 name -->
  <section class="scene" data-bg="#0e3b2c,#1f7a58" data-t="4600" data-chord="0">
    <div class="sm"><span class="w" style="--d:.2s">إلى الأستاذة الفاضلة</span></div>
    <div class="name"><span class="w gold" style="--d:.8s">مرفت</span></div>
    <svg class="underline" viewBox="0 0 300 30"><path class="draw" pathLength="1" style="--d:1.6s;--t:1.4s" stroke="#e9c46a" stroke-width="3" d="M10 18 C80 4 140 28 200 14 S280 10 290 16"/><circle class="pop" style="--d:2.9s" cx="150" cy="17" r="4" fill="#e9c46a"/></svg>
  </section>

  <!-- 2 -->
  <section class="scene" data-bg="#1d2b45,#3a4f7a" data-t="3200" data-chord="1">
    <div class="md"><span class="w" style="--d:.15s">عندنا</span> <span class="w" style="--d:.45s">كلمة</span> <span class="w" style="--d:.75s">صغيرة</span></div>
    <div class="md"><span class="w" style="--d:1.1s">ليكي…</span></div>
  </section>

  <!-- 3 thanks -->
  <section class="scene" data-bg="#2e1d06,#8f651c" data-t="3400" data-chord="2" data-petals="22">
    <div class="rays"></div>
    <div class="name" style="position:relative"><span class="w gold" style="--d:.15s">شكرًا</span></div>
  </section>

  <!-- 4 love -->
  <section class="scene" data-bg="#6b1f35,#c4566c" data-t="3800" data-chord="3">
    <svg class="icon" viewBox="0 0 100 90">
      <path class="draw" pathLength="1" style="--d:.1s;--t:1.5s" stroke="#fff" stroke-width="3.5" d="M50 84 C22 63 6 47 6 30 C6 16 17 6 30 6 C39 6 46 11 50 19 C54 11 61 6 70 6 C83 6 94 16 94 30 C94 47 78 63 50 84Z"/>
      <path class="fillin" style="--d:1.3s" fill="rgba(255,255,255,.22)" d="M50 84 C22 63 6 47 6 30 C6 16 17 6 30 6 C39 6 46 11 50 19 C54 11 61 6 70 6 C83 6 94 16 94 30 C94 47 78 63 50 84Z"/>
    </svg>
    <div class="md"><span class="w" style="--d:.6s">على حبك</span> <span class="w" style="--d:.95s">لينا</span></div>
  </section>

  <!-- 5 beside us -->
  <section class="scene" data-bg="#123a52,#2f7aa0" data-t="3800" data-chord="4">
    <svg class="icon" viewBox="0 0 120 90">
      <circle class="draw" pathLength="1" style="--d:.1s;--t:.9s" stroke="#fff" stroke-width="3.5" cx="42" cy="26" r="13"/>
      <circle class="draw" pathLength="1" style="--d:.3s;--t:.9s" stroke="#fff" stroke-width="3.5" cx="78" cy="26" r="13"/>
      <path class="draw" pathLength="1" style="--d:.7s;--t:1s" stroke="#fff" stroke-width="3.5" d="M18 84 C18 62 28 50 42 50 C52 50 58 55 61 62"/>
      <path class="draw" pathLength="1" style="--d:.85s;--t:1s" stroke="#fff" stroke-width="3.5" d="M102 84 C102 62 92 50 78 50 C64 50 54 60 54 84"/>
      <path class="pop" style="--d:1.7s" fill="#ff8fa3" d="M60 10 C57 6 51 7 51 12 C51 16 60 21 60 21 C60 21 69 16 69 12 C69 7 63 6 60 10Z"/>
    </svg>
    <div class="md"><span class="w" style="--d:.6s">وعلى إنك</span> <span class="w" style="--d:.95s">دايمًا جنبنا</span></div>
  </section>

  <!-- 6 sweet spirit -->
  <section class="scene" data-bg="#3e2a6b,#8a68c4" data-t="3800" data-chord="5">
    <svg class="icon" viewBox="0 0 100 100">
      <g transform="translate(50 50)">
        <ellipse class="draw" pathLength="1" style="--d:.05s;--t:.8s" stroke="#fff" stroke-width="3" cx="0" cy="-24" rx="11" ry="20"/>
        <ellipse class="draw" pathLength="1" style="--d:.2s;--t:.8s" stroke="#fff" stroke-width="3" cx="0" cy="-24" rx="11" ry="20" transform="rotate(60)"/>
        <ellipse class="draw" pathLength="1" style="--d:.35s;--t:.8s" stroke="#fff" stroke-width="3" cx="0" cy="-24" rx="11" ry="20" transform="rotate(120)"/>
        <ellipse class="draw" pathLength="1" style="--d:.5s;--t:.8s" stroke="#fff" stroke-width="3" cx="0" cy="-24" rx="11" ry="20" transform="rotate(180)"/>
        <ellipse class="draw" pathLength="1" style="--d:.65s;--t:.8s" stroke="#fff" stroke-width="3" cx="0" cy="-24" rx="11" ry="20" transform="rotate(240)"/>
        <ellipse class="draw" pathLength="1" style="--d:.8s;--t:.8s" stroke="#fff" stroke-width="3" cx="0" cy="-24" rx="11" ry="20" transform="rotate(300)"/>
        <circle class="pop" style="--d:1.5s" r="10" fill="#e9c46a"/>
      </g>
    </svg>
    <div class="md"><span class="w" style="--d:.6s">وعلى روحك</span> <span class="w" style="--d:.95s">الحلوة</span></div>
  </section>

  <!-- 7 certificate -->
  <section class="scene" data-bg="#0b2e22,#1f6b4f" data-t="5600" data-chord="6">
    <div class="cert">
      <svg class="frame" viewBox="0 0 300 400" preserveAspectRatio="none">
        <rect class="draw" pathLength="1" style="--d:.1s;--t:2s" x="4" y="4" width="292" height="392" rx="10" stroke="#e9c46a" stroke-width="2"/>
        <rect class="draw" pathLength="1" style="--d:.5s;--t:2s" x="14" y="14" width="272" height="372" rx="6" stroke="rgba(233,196,106,.5)" stroke-width="1"/>
        <g fill="#e9c46a">
          <circle class="pop" style="--d:2s" cx="14" cy="14" r="5"/><circle class="pop" style="--d:2.1s" cx="286" cy="14" r="5"/>
          <circle class="pop" style="--d:2.2s" cx="14" cy="386" r="5"/><circle class="pop" style="--d:2.3s" cx="286" cy="386" r="5"/>
        </g>
      </svg>
      <svg class="pop" style="--d:.9s;width:64px;height:64px" viewBox="0 0 64 64">
        <circle cx="32" cy="32" r="30" fill="#e9c46a"/><circle cx="32" cy="32" r="24" fill="none" stroke="#fff6d8" stroke-width="1.5" stroke-dasharray="3 3"/>
        <path d="M32 16 L36.5 27 L48 27.5 L39 34.5 L42 46 L32 39.5 L22 46 L25 34.5 L16 27.5 L27.5 27Z" fill="#fff6d8"/>
      </svg>
      <div class="title"><span class="w gold" style="--d:1.2s">شهادة شكر وتقدير</span></div>
      <div class="to"><span class="w" style="--d:1.8s">تُمنح للأستاذة</span></div>
      <div class="nm"><span class="w" style="--d:2.2s">مرفت</span></div>
      <div class="from"><span class="w" style="--d:3s">من الشركة وكل الفريق</span></div>
    </div>
  </section>

  <!-- 8 final -->
  <section class="scene" data-bg="#0b2e22,#2a8a64" data-t="0" data-chord="7" data-petals="40">
    <svg class="bouquet" viewBox="0 0 200 170">
      <g stroke="#7fc29b" stroke-width="3">
        <path class="draw" pathLength="1" style="--d:.1s;--t:1.2s" d="M100 168 C98 130 70 95 52 62"/>
        <path class="draw" pathLength="1" style="--d:.2s;--t:1.2s" d="M100 168 C100 120 88 80 82 38"/>
        <path class="draw" pathLength="1" style="--d:.3s;--t:1.2s" d="M100 168 C101 120 104 70 108 26"/>
        <path class="draw" pathLength="1" style="--d:.4s;--t:1.2s" d="M100 168 C104 125 126 85 140 50"/>
        <path class="draw" pathLength="1" style="--d:.5s;--t:1.2s" d="M100 168 C106 135 140 110 162 84"/>
        <path class="draw" pathLength="1" style="--d:.6s;--t:1s" d="M100 140 C88 128 72 128 64 132"/>
      </g>
      <g>
        <g class="pop" style="--d:1.2s"><circle cx="52" cy="58" r="15" fill="#f4a3b4"/><circle cx="52" cy="58" r="6" fill="#fff3c4"/></g>
        <g class="pop" style="--d:1.35s"><circle cx="82" cy="34" r="17" fill="#fff"/><circle cx="82" cy="34" r="7" fill="#e9c46a"/></g>
        <g class="pop" style="--d:1.5s"><circle cx="108" cy="22" r="18" fill="#e5577a"/><circle cx="108" cy="22" r="7" fill="#ffd6df"/></g>
        <g class="pop" style="--d:1.65s"><circle cx="140" cy="46" r="16" fill="#ffe08a"/><circle cx="140" cy="46" r="6" fill="#fff"/></g>
        <g class="pop" style="--d:1.8s"><circle cx="162" cy="80" r="14" fill="#c9a7ff"/><circle cx="162" cy="80" r="5" fill="#fff"/></g>
        <ellipse class="pop" style="--d:1.9s" cx="64" cy="132" rx="11" ry="5" fill="#7fc29b" transform="rotate(-15 64 132)"/>
        <path class="pop" style="--d:2s" d="M84 150 L116 150 L108 168 L92 168Z" fill="#e9c46a"/>
      </g>
    </svg>
    <div class="name" style="font-size:clamp(64px,19vw,104px)"><span class="w gold" style="--d:1.6s">شكرًا</span></div>
    <div class="md" style="margin-top:-6px"><span class="w" style="--d:2.2s">من قلوبنا كلنا 🌷</span></div>
    <div><span class="w" style="--d:3.2s"><button class="btn" id="again">↻ شوفيها تاني</button></span></div>
  </section>
</div>

<div class="tap" id="tap">اضغطي على الشاشة للتالي</div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const scenes=[...document.querySelectorAll('.scene')];
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* backgrounds */
  const bgs=scenes.map(s=>{
    const [a,b]=s.dataset.bg.split(','),d=document.createElement('div');
    d.className='bg';
    d.style.background=`radial-gradient(circle at 30% 25%,${b} 0,transparent 55%),radial-gradient(circle at 75% 80%,${b}aa 0,transparent 50%),${a}`;
    $('bgs').appendChild(d);return d;
  });

  /* bars */
  scenes.forEach(()=>{const b=document.createElement('div');b.className='bar';b.innerHTML='<i></i>';$('bars').appendChild(b);});
  const fills=[...document.querySelectorAll('.bar i')];

  /* bokeh */
  const cv=$('bokeh'),cx=cv.getContext('2d');let dots=[];
  function size(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;cx.setTransform(r,0,0,r,0,0);}
  addEventListener('resize',size);size();
  for(let i=0;i<34;i++) dots.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:2+Math.random()*16,v:.15+Math.random()*.45,a:.05+Math.random()*.18,p:Math.random()*6});
  (function loop(t){
    cx.clearRect(0,0,innerWidth,innerHeight);
    dots.forEach(d=>{
      if(!reduce){d.y-=d.v;d.x+=Math.sin(t/2000+d.p)*.2;}
      if(d.y<-20){d.y=innerHeight+20;d.x=Math.random()*innerWidth;}
      const g=cx.createRadialGradient(d.x,d.y,0,d.x,d.y,d.r);
      g.addColorStop(0,`rgba(255,240,200,${d.a})`);g.addColorStop(1,'rgba(255,240,200,0)');
      cx.fillStyle=g;cx.beginPath();cx.arc(d.x,d.y,d.r,0,6.3);cx.fill();
    });
    requestAnimationFrame(loop);
  })(0);

  /* sound: soft music-box chords */
  let ac=null,master=null,muted=false;
  const chords=[[60,64,67,72],[57,60,64,69],[65,69,72,77],[62,65,69,74],[67,71,74,79],[64,67,71,76],[65,69,72,76,79],[60,64,67,72,76,84]];
  const f=m=>440*Math.pow(2,(m-69)/12);
  function initAudio(){
    try{
      ac=new (window.AudioContext||window.webkitAudioContext)();
      master=ac.createGain();master.gain.value=.5;
      const dl=ac.createDelay();dl.delayTime.value=.32;const fb=ac.createGain();fb.gain.value=.32;
      const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2600;
      master.connect(lp);lp.connect(ac.destination);lp.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(ac.destination);
    }catch(e){ac=null;}
  }
  function note(m,when,vol=.12,dur=2.4){
    const o=ac.createOscillator(),o2=ac.createOscillator(),g=ac.createGain();
    o.type='sine';o2.type='triangle';o.frequency.value=f(m);o2.frequency.value=f(m)*2;
    const g2=ac.createGain();g2.gain.value=.15;
    o.connect(g);o2.connect(g2);g2.connect(g);g.connect(master);
    g.gain.setValueAtTime(0,when);g.gain.linearRampToValueAtTime(vol,when+.015);g.gain.exponentialRampToValueAtTime(.0001,when+dur);
    o.start(when);o2.start(when);o.stop(when+dur);o2.stop(when+dur);
  }
  function pad(m,when,dur){
    [0,7,12].forEach(i=>{
      const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f(m-12+i);
      o.connect(g);g.connect(master);
      g.gain.setValueAtTime(0,when);g.gain.linearRampToValueAtTime(.035,when+.8);g.gain.linearRampToValueAtTime(0,when+dur);
      o.start(when);o.stop(when+dur+.1);
    });
  }
  function playChord(i,len){
    if(!ac||muted) return;
    const c=chords[i%chords.length],t=ac.currentTime+.05;
    pad(c[0],t,Math.max(len/1000,3));
    c.forEach((m,k)=>note(m,t+k*.22,.11));
    note(c[c.length-1]+12,t+c.length*.22+.3,.06,3);
  }

  /* petals */
  function petals(n){
    if(reduce) return;
    const it=['🌷','🌸','💐','✨','🌼','🤍'];
    for(let i=0;i<n;i++){
      const s=document.createElement('span');s.className='petal';s.textContent=it[i%it.length];
      s.style.left=Math.random()*100+'vw';s.style.fontSize=(16+Math.random()*20)+'px';
      s.style.setProperty('--x',(Math.random()*80-40)+'px');
      s.style.animationDuration=(3.5+Math.random()*3)+'s';s.style.animationDelay=(Math.random()*1.5)+'s';
      document.body.appendChild(s);setTimeout(()=>s.remove(),9000);
    }
  }

  /* player */
  let cur=-1,timer=null,started=false;
  function go(i){
    if(i<0||i>=scenes.length) return;
    clearTimeout(timer);
    const prev=cur;cur=i;
    if(prev>=0){const o=scenes[prev];o.classList.remove('on');o.classList.add('out');setTimeout(()=>o.classList.remove('out'),500);}
    bgs.forEach((b,k)=>b.classList.toggle('show',k===i));
    const s=scenes[i],t=+s.dataset.t;
    setTimeout(()=>{if(cur===i){s.classList.remove('out');void s.offsetWidth;s.classList.add('on');}},prev>=0?350:0);
    playChord(+s.dataset.chord,t||6000);
    if(s.dataset.petals) setTimeout(()=>petals(+s.dataset.petals),i===scenes.length-1?1800:300);
    fills.forEach((fl,k)=>{fl.style.transition='none';fl.style.width=k<i?'100%':'0';});
    if(t){
      requestAnimationFrame(()=>requestAnimationFrame(()=>{fills[i].style.transition=`width ${t}ms linear`;fills[i].style.width='100%';}));
      timer=setTimeout(()=>go(i+1),t);
      $('tap').style.display='';
    }else{fills[i].style.width='100%';$('tap').style.display='none';}
  }
  function begin(){
    if(started) return;started=true;
    initAudio();
    $('start').classList.add('gone');
    setTimeout(()=>go(0),500);
  }
  $('start').addEventListener('click',begin);
  $('stage').addEventListener('click',e=>{
    if(!started||e.target.closest('.btn')) return;
    if(cur<scenes.length-1) go(cur+1);
  });
  $('again').addEventListener('click',e=>{e.stopPropagation();go(0);});
  $('mute').addEventListener('click',e=>{
    e.stopPropagation();muted=!muted;$('mute').textContent=muted?'🔇':'🔊';
    if(master) master.gain.value=muted?0:.5;
  });
})();
</script>
</body>
</html>
